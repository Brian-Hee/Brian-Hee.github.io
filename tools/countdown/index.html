<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #fff;
  overflow: hidden;
}
.container {
  width: 100%;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}
.title {
  font-size: 24px;
  opacity: 0.7;
  margin-bottom: 30px;
  letter-spacing: 4px;
}
.time-input {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  color: #fff;
  padding: 10px 20px;
  border-radius: 8px;
  font-size: 18px;
  margin-bottom: 40px;
  outline: none;
}
.time-input::-webkit-calendar-picker-indicator {
  filter: invert(1);
  cursor: pointer;
}
.countdown {
  display: flex;
  gap: 30px;
  justify-content: center;
  margin-bottom: 40px;
}
.time-block {
  background: rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 20px 30px;
  min-width: 120px;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.1);
}
.time-num {
  font-size: 64px;
  font-weight: 700;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.time-label {
  font-size: 14px;
  opacity: 0.6;
  margin-top: 8px;
  letter-spacing: 2px;
}
.message {
  font-size: 20px;
  opacity: 0.8;
  min-height: 30px;
}
.celebrate {
  animation: pulse 1s ease infinite;
  color: #4ecca3;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}
@media (max-width: 768px) {
  .countdown { gap: 12px; }
  .time-block { padding: 15px; min-width: 90px; }
  .time-num { font-size: 40px; }
}
</style>

<div class="container">
  <div class="title">⏰ 下班倒计时</div>
  <input type="time" id="offTime" class="time-input" value="18:00">
  <div class="countdown">
    <div class="time-block">
      <div class="time-num" id="hours">00</div>
      <div class="time-label">小时</div>
    </div>
    <div class="time-block">
      <div class="time-num" id="minutes">00</div>
      <div class="time-label">分钟</div>
    </div>
    <div class="time-block">
      <div class="time-num" id="seconds">00</div>
      <div class="time-label">秒</div>
    </div>
  </div>
  <div class="message" id="message">再坚持一下，就下班了 💪</div>
</div>

<script>
const offTimeInput = document.getElementById('offTime');
const hoursEl = document.getElementById('hours');
const minutesEl = document.getElementById('minutes');
const secondsEl = document.getElementById('seconds');
const messageEl = document.getElementById('message');

// 读取保存的时间
const saved = localStorage.getItem('offTime');
if (saved) offTimeInput.value = saved;

offTimeInput.addEventListener('change', () => {
  localStorage.setItem('offTime', offTimeInput.value);
});

function pad(n) { return String(n).padStart(2, '0'); }

function tick() {
  const now = new Date();
  const [h, m] = offTimeInput.value.split(':').map(Number);
  const off = new Date(now);
  off.setHours(h, m, 0, 0);
  
  // 如果下班时间已经过了，算明天
  if (off < now) off.setDate(off.getDate() + 1);
  
  const diff = off - now;
  const hrs = Math.floor(diff / 3600000);
  const mins = Math.floor((diff % 3600000) / 60000);
  const secs = Math.floor((diff % 60000) / 1000);
  
  hoursEl.textContent = pad(hrs);
  minutesEl.textContent = pad(mins);
  secondsEl.textContent = pad(secs);
  
  if (diff < 0) {
    messageEl.textContent = '🎉 下班啦！快走吧！';
    messageEl.classList.add('celebrate');
  } else if (hrs === 0 && mins < 30) {
    messageEl.textContent = '快了快了，再熬一会儿 🔥';
  } else if (hrs === 0 && mins < 60) {
    messageEl.textContent = '已经下午了，胜利在望 ⏳';
  } else {
    messageEl.textContent = '再坚持一下，就下班了 💪';
    messageEl.classList.remove('celebrate');
  }
}

tick();
setInterval(tick, 1000);
</script>
